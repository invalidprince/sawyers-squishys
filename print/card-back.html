<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sawyer's Squishys — business card back</title>
<style>
  /* 3.5in x 2in card + 0.125in bleed each side = 3.75in x 2.25in.
     Rendered at 300 DPI: 1125 x 675 px. Safe zone = 0.125in inside trim. */
  :root{
    --navy:#1e2c70; --navy-deep:#16205a; --pink:#f0359a; --blue:#4fb8e8;
    --green:#6cc24a; --yellow:#f6c025; --purple:#8b3fc9; --teal:#28c4b8; --cream:#f5deb3;
    --font:"Arial Rounded MT Bold","SF Pro Rounded",ui-rounded,"Nunito","Segoe UI Rounded",Arial,sans-serif;
  }
  html,body{margin:0;padding:0;background:#888;}
  .card{
    position:relative; width:3.75in; height:2.25in; overflow:hidden;
    background:radial-gradient(120% 140% at 15% 0%, #2a3a8f 0%, var(--navy) 45%, var(--navy-deep) 100%);
    font-family:var(--font); color:#fff;
  }
  /* rainbow stripe top edge */
  .stripe{position:absolute;left:0;right:0;top:0;height:.16in;
    background:linear-gradient(90deg,var(--pink) 0 20%,var(--yellow) 20% 40%,var(--green) 40% 60%,var(--blue) 60% 80%,var(--purple) 80% 100%);}
  /* soft blobs */
  .blob{position:absolute;border-radius:50%;opacity:.16;filter:blur(2px)}
  .b1{width:1.3in;height:1.3in;left:-.45in;bottom:-.55in;background:var(--pink)}
  .b2{width:.9in;height:.9in;right:1.05in;top:-.35in;background:var(--teal)}
  .b3{width:.6in;height:.6in;left:1.45in;bottom:-.2in;background:var(--yellow)}

  .inner{position:absolute;inset:.29in .3in .29in .3in;display:flex;gap:.2in;align-items:stretch}
  .left{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .right{width:1.05in;display:flex;flex-direction:column;align-items:center;justify-content:center}

  .hi{font-size:.12in;letter-spacing:.008in;color:var(--cream);margin:0 0 .01in}
  .tag{font-size:.2in;line-height:1.05;margin:0;font-weight:700;white-space:nowrap}
  .tag .dot{color:var(--yellow);padding:0 .035in}
  .lead{font-size:.1in;line-height:1.3;margin:.05in 0 0;color:#e6e9ff;max-width:2.05in}

  .chips{display:flex;flex-wrap:nowrap;gap:.045in;margin:.06in 0 0}
  .chip{font-size:.08in;font-weight:700;padding:.038in .075in;border-radius:.2in;color:var(--navy-deep);white-space:nowrap}
  .c1{background:var(--yellow)} .c2{background:var(--green)} .c3{background:var(--pink);color:#fff}

  .url{margin:0;font-size:.165in;font-weight:700;letter-spacing:.002in;color:#fff;white-space:nowrap}
  .url span{color:var(--yellow)}
  .sub{margin:.015in 0 0;font-size:.085in;color:#b9c1f2}

  .qrbox{background:#fff;border-radius:.14in;padding:.075in;box-shadow:0 .04in 0 rgba(0,0,0,.25)}
  .qrbox img{display:block;width:.86in;height:.86in}
  .scan{margin:.07in 0 0;font-size:.1in;font-weight:700;color:var(--yellow);text-align:center;line-height:1.2}

  /* trim guide (preview only) */
  .trim{position:absolute;inset:.125in;border:1px dashed rgba(255,255,255,.35);pointer-events:none;display:none}
  body.preview .trim{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="stripe"></div>
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <div class="trim"></div>
  <div class="inner">
    <div class="left">
      <div>
        <p class="hi">Hi, I'm Sawyer! 👋</p>
        <p class="tag">Squish It<span class="dot">•</span>Love It</p>
        <p class="lead">Super-soft, super-cute squishys. Want to order or see what's in stock? Send me a note!</p>
        <div class="chips">
          <span class="chip c1">Orders</span>
          <span class="chip c2">What's in stock</span>
          <span class="chip c3">Bulk discounts</span>
        </div>
      </div>
      <div>
        <p class="url">sawyers<span>squishys</span>.com</p>
        <p class="sub">Find my booth at festivals &amp; markets</p>
      </div>
    </div>
    <div class="right">
      <div class="qrbox"><img src="../assets/qr-site.svg" alt="QR code to sawyerssquishys.com"></div>
      <p class="scan">Scan to order</p>
    </div>
  </div>
</div>
</body>
</html>
